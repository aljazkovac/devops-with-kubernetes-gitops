apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-project-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aljazkovac/devops-with-kubernetes-gitops.git
    targetRevision: HEAD
    path: todo-project/kustomize/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: project-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
